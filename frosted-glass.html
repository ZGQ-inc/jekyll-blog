            --md-sys-color-error: #BA1A1A;

            --md-sys-color-tertiary: #7D5260;

            --md-sys-color-error: #FFB4AB;

            --md-sys-color-on-background: #E2E2E6;
            --md-sys-color-surface: #1A1C1E;

            --md-sys-color-on-error-container: #FFDAD6;

            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            margin: 0;
            padding: 0;
            transition: background-color var(--transition-speed);
            overflow-y: scroll;
        }

        .top-sticky-area {
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .top-sticky-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background-color: color-mix(in srgb, var(--md-sys-color-surface) 85%, transparent);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            box-shadow: var(--elevation-1);
            border-bottom: 1px solid var(--md-sys-color-surface-variant);
            transition: background-color var(--transition-speed);
            pointer-events: none;

        header {

            justify-content: space-between;
            align-items: center;
        }

        .header-title-group {

            gap: 8px;

            margin: 0 auto;
            background: transparent;
            box-shadow: none;
        }

        .container {
            padding: 16px;

            margin: 0 auto;
            padding-bottom: 100px;
        }

        .control-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }

        .control-row:last-child {
            margin-bottom: 0;

        .filter-section {
            background: color-mix(in srgb, var(--md-sys-color-surface-variant) 35%, transparent);
            padding: 12px;
            border-radius: var(--radius-small);

        .filter-pool-container {
            min-height: 40px;
            display: flex;
            flex-wrap: wrap;

        .floating-island {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background-color: color-mix(in srgb, var(--md-sys-color-surface-container-high) 80%, transparent);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
            box-shadow: var(--elevation-2);
            border-radius: 100px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 99;
            border: 1px solid color-mix(in srgb, var(--md-sys-color-outline) 30%, transparent);
            transition: opacity 0.3s, transform 0.3s;
        }

        .island-divider {
            width: 1px;
            height: 20px;
            background-color: var(--md-sys-color-outline);
            opacity: 0.3;
        }

        .island-text {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--md-sys-color-on-surface-variant);

        }

        .native-icon {

            font-weight: normal;
            font-style: normal;
            font-size: 1.05rem;
            line-height: 1;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            vertical-align: text-bottom;

        .native-chip {

        }

            border-radius: var(--radius-small);

            transition: box-shadow 0.2s, transform 0.2s;

        .md-card:hover {

        .card-thumb-wrapper {
            position: relative;
            background: var(--md-sys-color-surface-variant);
            display: block;

        .card-thumb {
            position: absolute;
            top: 0;

            width: 100%;
            height: 100%;
            object-fit: cover;

            -webkit-line-clamp: 2;

        .card-title a {

        .card-subtitle {

        .meta-icons {
            display: flex;

        .gallery-container.list-mode {

        @media (max-width: 768px) {
            header {
                padding: 12px 16px;
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .header-title-group {

            }

            .gallery-container.grid-mode .card-title {

            .gallery-container.list-mode .md-card {

            }

            .gallery-container.list-mode .card-thumb-wrapper {
                width: 105px;

            .gallery-container.list-mode .card-content {

            }

            .gallery-container.list-mode .card-title {
                font-size: 0.95rem;
                margin-bottom: 2px;
                -webkit-line-clamp: 2;

            .gallery-container.list-mode .card-subtitle {

            .gallery-container.list-mode .tags-wrapper {

            }

            .gallery-container.list-mode .tags-container {

            .native-chip {
                white-space: nowrap;
