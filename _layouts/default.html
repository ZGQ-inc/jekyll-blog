<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}"
      data-theme="light"
      data-color="blue">
<head>
  {% include head.html %}
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</head>
<body>

<!-- Reading Progress Bar -->
<div id="readingProgress" aria-hidden="true"></div>

<!-- App Shell -->
<div class="app-shell">

  <!-- Sidebar (includes overlay + theme dialog) -->
  {% include sidebar.html %}

  <!-- Main Content -->
  <div class="main-content">

    <!-- Mobile Top App Bar -->
    <header class="top-app-bar" role="banner">
      <button class="icon-btn" id="menuBtn" aria-label="打开菜单" aria-expanded="false" aria-controls="sidebar">
        <span class="material-symbols-outlined">menu</span>
      </button>
      <span class="app-bar-title">{{ site.title }}</span>
    </header>

    <!-- Page Content -->
    {{ content }}

    <!-- Footer -->
    <footer class="site-footer" role="contentinfo">
      <p>
        © {{ 'now' | date: "%Y" }} <a href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
        · Built with <a href="https://jekyllrb.com" target="_blank" rel="noopener">Jekyll</a>
        · Hosted on <a href="https://pages.cloudflare.com" target="_blank" rel="noopener">Cloudflare Pages</a>
      </p>
    </footer>

  </div><!-- /main-content -->
</div><!-- /app-shell -->

<!-- Back to Top FAB -->
<button class="fab back-to-top" id="backToTopBtn" aria-label="回到顶部">
  <span class="material-symbols-outlined">arrow_upward</span>
</button>

<!-- Mermaid.js for Markdown Diagrams (Lazy Loaded) -->
<script type="module">
  const mermaidBlocks = document.querySelectorAll('.language-mermaid');
  if (mermaidBlocks.length > 0) {
    mermaidBlocks.forEach((block) => {
      const codeEl = block.querySelector('code');
      if (!codeEl) return;
      
      const mermaidCode = codeEl.textContent;
      const newContainer = document.createElement('div');
      newContainer.className = 'mermaid';
      newContainer.textContent = mermaidCode;
      newContainer.style.textAlign = 'center';
      newContainer.style.margin = '1.5em 0';
      
      block.parentNode.replaceChild(newContainer, block);
    });

    import('https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs').then((module) => {
      const mermaid = module.default;
      const rootTheme = document.documentElement.getAttribute('data-theme') || 'light';
      mermaid.initialize({
        startOnLoad: false,
        theme: rootTheme === 'dark' ? 'dark' : 'default',
        fontFamily: '"Inter", "Noto Sans SC", sans-serif'
      });
      mermaid.run();
    });
  }
</script>

</body>
</html>
