<!-- Cloudflare Edge Sensor Micro-Badge -->
<div class="edge-sensor-container">
  <button class="edge-sensor-badge" id="edgeSensorBadge" type="button" aria-label="查看 Cloudflare 边缘节点与网络连接详情" title="查看 Cloudflare 边缘感知详情">
    <span class="edge-sensor-dot" aria-hidden="true"></span>
    <span class="edge-sensor-text">
      <span class="edge-colo" id="edgeColoBadge">Colo: 检测中...</span>
      <span class="edge-sep">·</span>
      <span class="edge-proto" id="edgeProtoBadge">HTTP/3</span>
      <span class="edge-sep">·</span>
      <span class="edge-tls" id="edgeTlsBadge">TLS 1.3</span>
      <span class="edge-sep">·</span>
      <span class="edge-rtt" id="edgeRttBadge">-- ms</span>
    </span>
  </button>
</div>

<!-- Edge Details Modal -->
<div class="edge-sensor-modal" id="edgeSensorModal" aria-hidden="true">
  <div class="edge-sensor-modal-backdrop" id="edgeSensorBackdrop"></div>
  <div class="edge-sensor-modal-content" role="dialog" aria-modal="true" aria-labelledby="edgeModalTitle">
    <div class="edge-sensor-modal-header">
      <div class="edge-sensor-modal-title" id="edgeModalTitle">
        <span class="material-symbols-outlined">cloud</span>
        <span>Cloudflare 边缘感知详情</span>
      </div>
      <button class="edge-sensor-close-btn" id="edgeModalCloseBtn" type="button" aria-label="关闭详情窗口">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="edge-sensor-details-body">
      <div class="edge-detail-row">
        <span class="edge-detail-label">数据中心节点:</span>
        <span class="edge-detail-val" id="edgeColoVal">检测中...</span>
      </div>
      <div class="edge-detail-row">
        <span class="edge-detail-label">传输协议:</span>
        <span class="edge-detail-val" id="edgeProtoVal">HTTP/3 (QUIC)</span>
      </div>
      <div class="edge-detail-row">
        <span class="edge-detail-label">安全密码套件:</span>
        <span class="edge-detail-val" id="edgeTlsVal">TLSv1.3</span>
      </div>
      <div class="edge-detail-row">
        <span class="edge-detail-label">往返延迟 (RTT):</span>
        <span class="edge-detail-val" id="edgeRttVal">-- ms</span>
      </div>
      <div class="edge-detail-row">
        <span class="edge-detail-label">全球网络接入:</span>
        <span class="edge-detail-val">Cloudflare Anycast</span>
      </div>
    </div>
  </div>
</div>
