<!-- Bottom Floating Island Pagination (MD3) -->
<div class="floating-island" id="bottomIsland" style="display: none;">
  <button type="button" class="island-icon-btn" id="btnPrev" aria-label="上一页" title="上一页">
    <span class="material-symbols-outlined">arrow_back_ios_new</span>
  </button>

  <span class="island-text" id="pageInfo">1 / 1</span>

  <button type="button" class="island-icon-btn" id="btnNext" aria-label="下一页" title="下一页">
    <span class="material-symbols-outlined">arrow_forward_ios</span>
  </button>
</div>
