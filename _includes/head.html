<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/avatar.png' | relative_url }}">
<link rel="manifest" href="{{ '/manifest.json' | relative_url }}">

<!-- SEO -->
{% seo %}

<!-- Canonical -->
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Critical Page Loader & Preload Styles -->
<style>
  .preload *:not(#pageLoader, #pageLoader *) {
    transition: none !important;
    animation-play-state: paused !important;
  }
  #pageLoader {
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--md-sys-color-surface, #FDFCFF);
    opacity: 1;
    visibility: visible;
    transition: opacity 0.35s cubic-bezier(0.2, 0, 0, 1), visibility 0.35s cubic-bezier(0.2, 0, 0, 1);
    pointer-events: auto;
  }
  html[data-theme="dark"] #pageLoader {
    background-color: var(--md-sys-color-surface, #1A1C1E);
  }
  #pageLoader.is-loaded {
    opacity: 0 !important;
    visibility: hidden !important;
    pointer-events: none !important;
  }
  .page-loader-spinner {
    width: 44px;
    height: 44px;
    min-width: 44px;
    min-height: 44px;
    max-width: 44px;
    max-height: 44px;
    aspect-ratio: 1 / 1;
    box-sizing: border-box;
    border: 4px solid color-mix(in srgb, var(--md-sys-color-primary, #0061A4) 18%, transparent);
    border-top-color: var(--md-sys-color-primary, #0061A4);
    border-radius: 50%;
    transform-origin: center center;
    animation: pageLoaderSpin 0.85s linear infinite !important;
  }
  @keyframes pageLoaderSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>

<!-- Anti-FOUC Theme Script -->
<script>
  (function() {
    var color = 'blue', mode = 'system';
    var validColors = ['blue', 'purple', 'green', 'orange', 'rose', 'teal'];
    try {
      var saved = localStorage.getItem('zgq-blog-theme');
      if (saved) {
        var parsed = JSON.parse(saved);
        if (parsed.color && validColors.indexOf(parsed.color) !== -1) color = parsed.color;
        if (parsed.mode === 'light' || parsed.mode === 'dark') mode = parsed.mode;
      }
    } catch(e) {}
    var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-color', color);
  })();
</script>

<!-- Main Stylesheet -->
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">

<!-- Fonts: Noto Sans SC + Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

<!-- Material Web Components -->
<script type="importmap">
{
  "imports": {
    "@material/web/": "https://esm.run/@material/web/"
  }
}
</script>
<script type="module">
  import '@material/web/all.js';
</script>

<!-- Fuse.js for Full-Text Search -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>

<script>
  if (sessionStorage.getItem('isNavigating')) {
    document.documentElement.classList.add('is-navigating');
  }
  
  if (window.location.hash) {
    window._initialHash = window.location.hash;
    history.replaceState(null, null, window.location.pathname + window.location.search);
    if ('scrollRestoration' in history) {
      window._originalScrollRestoration = history.scrollRestoration;
      history.scrollRestoration = 'manual';
    }
    window.scrollTo(0, 0);
  }
</script>

<!-- Open Graph extras -->
{% if page.image %}
<meta property="og:image" content="{{ page.image | absolute_url }}">
{% endif %}
<meta property="og:site_name" content="{{ site.title }}">
<meta name="twitter:card" content="summary_large_image">

<!-- MathJax for LaTeX formulas -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    svg: { fontCache: 'global' }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
