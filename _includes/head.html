<!-- Instant Anti-FOUC Dark Mode & Canvas Setup (Must be first in head) -->
<script>
  (function() {
    var color = 'blue', mode = 'system';
    var validColors = ['blue', 'purple', 'green', 'orange', 'rose', 'teal'];
    try {
      var saved = localStorage.getItem('zgq-blog-theme');
      if (saved) {
        var parsed = JSON.parse(saved);
        if (parsed.color && validColors.indexOf(parsed.color) !== -1) color = parsed.color;
        if (parsed.mode === 'light' || parsed.mode === 'dark') mode = parsed.mode;
      }
    } catch(e) {}
    var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var doc = document.documentElement;
    doc.setAttribute('data-theme', isDark ? 'dark' : 'light');
    doc.setAttribute('data-color', color);
    doc.style.colorScheme = isDark ? 'dark' : 'light';
    doc.style.backgroundColor = isDark ? '#1A1C1E' : '#FDFCFF';

    // Instant Anti-FOUC Vault Unlock Verification
    try {
      var vaultAuth = localStorage.getItem('zgq_vault_auth');
      if (!vaultAuth) {
        var vMatch = document.cookie.match(/(?:^|;\s*)zgq_vault_auth=([^;]+)/);
        if (vMatch) vaultAuth = decodeURIComponent(vMatch[1]);
      }
      if (vaultAuth) {
        var vData = JSON.parse(vaultAuth);
        if (vData && vData.expires && Date.now() < vData.expires && vData.key) {
          doc.classList.add('vault-unlocked');
        }
      }
    } catch(e) {}

    var themeColor = isDark ? '#1A1C1E' : '#FDFCFF';
    var metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) metaTheme.setAttribute('content', themeColor);
  })();
</script>

<!-- Critical Page Loader & Canvas Styles -->
<style>
  /* Vault Restricted Content - Hidden completely unless unlocked */
  html:not(.vault-unlocked) .vault-restricted,
  html:not(.vault-unlocked) [data-restricted="true"],
  html:not(.vault-unlocked) .vault-restricted-item {
    display: none !important;
  }
  html.vault-unlocked .count-public {
    display: none !important;
  }
  html.vault-unlocked .count-total {
    display: inline !important;
  }
  :root {
    color-scheme: light dark;
  }
  html {
    background-color: #FDFCFF;
    color-scheme: light;
  }
  html[data-theme="dark"] {
    background-color: #1A1C1E !important;
    color-scheme: dark !important;
  }
  body {
    background-color: inherit;
    margin: 0;
  }
  .preload *:not(#pageLoader, #pageLoader *) {
    transition: none !important;
    animation-play-state: paused !important;
  }
  #pageLoader {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #FDFCFF;
    color: #1A1C1E;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    opacity: 1;
    visibility: visible;
    transform: scale(1);
    filter: blur(0px);
    transition: opacity 0.32s cubic-bezier(0.2, 0, 0, 1),
                transform 0.32s cubic-bezier(0.2, 0, 0, 1),
                filter 0.32s cubic-bezier(0.2, 0, 0, 1),
                visibility 0.32s;
    pointer-events: auto;
  }
  html[data-theme="dark"] #pageLoader {
    background-color: #1A1C1E !important;
    color: #E2E2E6 !important;
  }
  #pageLoader.is-loaded {
    opacity: 0 !important;
    visibility: hidden !important;
    transform: scale(1.03) !important;
    filter: blur(4px) !important;
    pointer-events: none !important;
  }
  .splash-brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 24px;
    user-select: none;
    -webkit-user-select: none;
  }
  .splash-logo-wrapper {
    position: relative;
    width: 76px;
    height: 76px;
    border-radius: 22px;
    margin-bottom: 18px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0061A4;
  }
  html[data-theme="dark"] .splash-logo-wrapper {
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    background: #1c2b3d;
  }
  .splash-logo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 22px;
    display: block;
  }
  .splash-title {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.015em;
    margin-bottom: 4px;
    font-family: 'Noto Sans SC', system-ui, sans-serif;
  }
  .splash-subtitle {
    font-size: 0.8125rem;
    opacity: 0.65;
    margin-bottom: 26px;
    font-family: 'Noto Sans SC', system-ui, sans-serif;
    letter-spacing: 0.01em;
  }
  .splash-progress-track {
    width: 160px;
    height: 4px;
    border-radius: 2px;
    background: rgba(0, 97, 164, 0.16);
    position: relative;
    overflow: hidden;
  }
  html[data-theme="dark"] .splash-progress-track {
    background: rgba(158, 202, 255, 0.16);
  }
  .splash-progress-bar-primary,
  .splash-progress-bar-secondary {
    position: absolute;
    top: 0;
    bottom: 0;
    border-radius: 2px;
    background-color: #0061A4;
    will-change: left, right;
  }
  html[data-theme="dark"] .splash-progress-bar-primary,
  html[data-theme="dark"] .splash-progress-bar-secondary {
    background-color: #9ECAFF;
  }
  .splash-progress-bar-primary {
    animation: md3LinearPrimary 1.8s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
  }
  .splash-progress-bar-secondary {
    animation: md3LinearSecondary 1.8s cubic-bezier(0.165, 0.84, 0.44, 1) infinite;
    animation-delay: 0.45s;
  }
  @keyframes md3LinearPrimary {
    0% { left: -35%; right: 100%; }
    60% { left: 100%; right: -90%; }
    100% { left: 100%; right: -90%; }
  }
  @keyframes md3LinearSecondary {
    0% { left: -200%; right: 100%; }
    60% { left: 107%; right: -8%; }
    100% { left: 107%; right: -8%; }
  }
</style>

<!-- Fuse.js for Full-Text Search -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>

<script>
  if (sessionStorage.getItem('isNavigating')) {
    document.documentElement.classList.add('is-navigating');
  }
  
  if (window.location.hash) {
    window._initialHash = window.location.hash;
    history.replaceState(null, null, window.location.pathname + window.location.search);
    if ('scrollRestoration' in history) {
      window._originalScrollRestoration = history.scrollRestoration;
      history.scrollRestoration = 'manual';
    }
    window.scrollTo(0, 0);
  }
</script>

      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    svg: { fontCache: 'global' }
  };
</script>
