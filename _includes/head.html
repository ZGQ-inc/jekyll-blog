<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FDFCFF">
<link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/images/avatar.png' | relative_url }}">
<link rel="manifest" href="{{ '/manifest.json' | relative_url }}">

<!-- SEO -->
{% seo %}

<!-- Canonical -->
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Anti-FOUC Theme Script -->
<script>
  (function() {
    try {
      var saved = localStorage.getItem('zgq-blog-theme');
      var color = 'blue', mode = 'system';
      if (saved) {
        var parsed = JSON.parse(saved);
        color = parsed.color || 'blue';
        mode = parsed.mode || 'system';
      }
      var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-color', color);
    } catch(e) {}
  })();
</script>

<!-- Fonts: Noto Sans SC + Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

<!-- Material Web Components -->
<script type="importmap">
{
  "imports": {
    "@material/web/": "https://esm.run/@material/web/"
  }
}
</script>
<script type="module">
  import '@material/web/all.js';
</script>

<!-- Fuse.js for Full-Text Search -->
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>

<script>
  if (sessionStorage.getItem('isNavigating')) {
    document.documentElement.classList.add('is-navigating');
  }
  
  if (window.location.hash) {
    window._initialHash = window.location.hash;
    history.replaceState(null, null, window.location.pathname + window.location.search);
    if ('scrollRestoration' in history) {
      window._originalScrollRestoration = history.scrollRestoration;
      history.scrollRestoration = 'manual';
    }
    window.scrollTo(0, 0);
  }
</script>

<!-- Main Stylesheet -->
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

<!-- Open Graph extras -->
{% if page.image %}
<meta property="og:image" content="{{ page.image | absolute_url }}">
{% endif %}
<meta property="og:site_name" content="{{ site.title }}">
<meta name="twitter:card" content="summary_large_image">

<!-- MathJax for LaTeX formulas -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    svg: { fontCache: 'global' }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
