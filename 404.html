---
layout: default
title: 页面未找到
permalink: /404.html
---

<link rel="stylesheet" href="{{ '/assets/css/404.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script src="{{ '/assets/js/404.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>

<main class="page-content error-404-page" role="main">
  <!-- Dynamic Matrix Digital Rain Canvas -->
  <canvas id="matrixCanvas" class="error-canvas" aria-hidden="true"></canvas>

  <!-- MD3 Elevated Surface Card -->
  <div class="error-card">
    <!-- Status Badge -->
    <div class="error-badge">
      <span class="matrix-status-pulse"></span>
      <span>SYSTEM 404 // ROUTE NOT FOUND</span>
    </div>

    <!-- Error Code Display -->
    <div class="error-code-display" aria-label="404">404</div>

    <!-- Error Title & Description -->
    <h1 class="error-title">页面未找到</h1>
    <p class="error-desc">
      抱歉，您访问的页面节点不存在，该资源可能已被迁移、重构或链接已失效。
    </p>

    <!-- Main Navigation Actions -->
    <div class="error-btn-group">
      <a href="{{ '/' | relative_url }}" class="action-btn btn-filled error-action-btn">
        <span class="material-symbols-outlined">home</span>
        <span>返回博客首页</span>
      </a>

      <button type="button" class="action-btn btn-tonal error-action-btn" onclick="if(window.history.length > 1){window.history.back();}else{window.location.href='{{ '/' | relative_url }}';}">
        <span class="material-symbols-outlined">arrow_back</span>
        <span>返回上一页</span>
      </button>
    </div>

    <!-- Quick Navigation Links -->
    <div class="error-quick-links">
      <a href="{{ '/archives/' | relative_url }}" class="action-btn btn-outlined error-quick-btn" title="查看文章归档">
        <span class="material-symbols-outlined">inventory_2</span>
        <span>文章归档</span>
      </a>
      <a href="{{ '/tags/' | relative_url }}" class="action-btn btn-outlined error-quick-btn" title="浏览全部标签">
        <span class="material-symbols-outlined">label</span>
        <span>全站标签</span>
      </a>
      <a href="{{ '/links/' | relative_url }}" class="action-btn btn-outlined error-quick-btn" title="友情链接">
        <span class="material-symbols-outlined">link</span>
        <span>友情链接</span>
      </a>
    </div>
  </div>
</main>
