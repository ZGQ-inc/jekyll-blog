# Site Settings
title: "ZGQ Inc.'s Blog"
description: "个人博客。"
url: "https://blog.zgqinc.gq"
baseurl: ""
lang: "zh-CN"
timezone: Asia/Shanghai

# Author
author:
  name: "ZGQ Inc."
  bio: "个人博客。"
  avatar: "/assets/images/avatar.png"

# Progressive Web App (PWA) & Native OS Splash Screen
pwa:
  name: "ZGQ Inc."
  short_name: "ZGQ Blog"
  description: "ZGQ Inc. 个人博客。"
  background_color: "#1A1C1E"
  theme_color: "#1A1C1E"
  display: "standalone"

# Navigation
nav_links:
  - title: "首页"
    url: "/"
    icon: "home"
  - title: "文章"
    url: "/posts/"
    icon: "article"
  - title: "标签"
    url: "/tags/"
    icon: "label"
  - title: "分类"
    url: "/categories/"
    icon: "folder"
  - title: "归档"
    url: "/archives/"
    icon: "inventory_2"
  - title: "动态"
    url: "/updates/"
    icon: "dynamic_feed"
  - title: "友链"
    url: "/links/"
    icon: "link"
  - title: "关于"
    url: "/about/"
    icon: "info"

# Social Links
social:
  github: "ZGQ-inc"
  telegram: "ZGQinc"
  telegram_channel: "CopyRightZGQInc"
  navigation: "https://domain.zgqinc.gq"
  rss: true

# Comments (comments.app)
comments:
  enabled: true
  app_id: "WePGSdzi"

# Worker API
worker_api_url: "https://api.zgqinc.gq"

# Telegram Instant View (即时预览专属 Rules Hash)
telegram_iv_rhash: "aefab8c132338b"

# Cloudflare Turnstile (人机安全验证，防止暴力碰撞)
# 说明: "1x00000000000000000000AA" 为 Cloudflare 官方测试密钥（会显示“仅用于测试”）。
# 正式上线请在 Cloudflare Dash -> Turnstile 添加站点 blog.zgqinc.gq，将获取到的 Site Key (形如 0x4AAAAAA...) 替换下方配置。
turnstile_site_key: "0x4AAAAAAFs46xTj_x2e4dfU"

# Build & Markdown
markdown: kramdown
highlighter: rouge
future: true

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Permalink style
permalink: /posts/:slug/

# HTML Sandbox & Playground Configuration
sandbox:
  playground_root: "/playground/"    # 允许引用的本地静态页面根目录
  jail: true                         # 是否默认开启目录受限（只能运行 playground 内的内容，防目录遍历）
  allow_cookies: false               # 是否默认允许读取/写入 Cookie（为安全起见默认关闭）
  allow_same_origin: false           # 是否默认赋予同源权限（为安全起见默认关闭）
  allow_cross_origin: true           # 是否默认允许请求外部跨域 API / CDN 资源
  allow_cross_path: false            # 是否允许跨路径引用其他非 playground 文件夹
  default_height: "400px"            # 默认视口高度
  default_profile: "strict"          # 默认安全策略 (strict | isolated | standard | loose)

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Feed Settings
feed:
  excerpt_only: true

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - "*.gem"
  - vendor/
  - worker/
  - scripts/
  - .env.example
  - README.md
  - .github/
  - node_modules/
  - instantview/
