# Site Settings
title: "ZGQ Inc.'s Blog"
description: "博客原型。"
url: "https://blog.zgqinc.gq"
baseurl: ""
lang: "zh-CN"
timezone: Asia/Shanghai

# Author
author:
  name: "ZGQ Inc."
  bio: "博客原型。"
  avatar: "/assets/images/avatar.png"

# Navigation
nav_links:
  - title: "首页"
    url: "/"
    icon: "home"
  - title: "文章"
    url: "/posts/"
    icon: "article"
  - title: "标签"
    url: "/tags/"
    icon: "label"
  - title: "分类"
    url: "/categories/"
    icon: "folder"
  - title: "归档"
    url: "/archives/"
    icon: "inventory_2"
  - title: "动态"
    url: "/updates/"
    icon: "dynamic_feed"
  - title: "友链"
    url: "/links/"
    icon: "link"
  - title: "关于"
    url: "/about/"
    icon: "info"

# Social Links
social:
  github: "ZGQ-inc"
  telegram: "ZGQinc"
  telegram_channel: "CopyRightZGQInc"
  navigation: "https://domain.zgqinc.gq"
  rss: true

# Comments (comments.app)
comments:
  enabled: true
  app_id: "WePGSdzi"

# Worker API
worker_api_url: "https://api.zgqinc.gq"

# Build & Markdown
markdown: kramdown
highlighter: rouge
future: true

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Permalink style
permalink: /posts/:slug/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - "*.gem"
  - vendor/
  - worker/
  - scripts/
  - .env.example
  - README.md
  - .github/
  - node_modules/
