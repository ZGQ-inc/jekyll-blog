name: Deploy Blog & Notify Telegram

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ================================================================
  # Job 1: Build Jekyll & Deploy to Cloudflare Pages
  # ================================================================
  build-and-deploy:
    name: Build Jekyll → Deploy CF Pages
    runs-on: ubuntu-latest
    outputs:
      deploy_url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need depth 2 to detect changed files

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Build Jekyll
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: ${{ secrets.CF_PAGES_PROJECT_NAME }}
          directory: _site
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          wranglerVersion: '3'

  # ================================================================
  # Job 2: Detect new posts & notify Worker to push TG
  # ================================================================
  notify-telegram:
    name: Notify Telegram Channel
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: false # Disabled: using manual /link in Telegram

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect new/modified posts
        id: detect
        run: |
          # Find .md files changed in the last commit under _posts/
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- '_posts/*.md' 2>/dev/null || \
                    git show --name-only HEAD --pretty=format: -- '_posts/*.md')

          echo "Changed files: $CHANGED"

          if [ -z "$CHANGED" ]; then
            echo "no_new_posts=true" >> $GITHUB_OUTPUT
            echo "No new posts detected."
          else
            # Take first changed post (in case of multiple)
            POST_FILE=$(echo "$CHANGED" | head -n1)
            echo "post_file=$POST_FILE" >> $GITHUB_OUTPUT
            echo "no_new_posts=false" >> $GITHUB_OUTPUT
            echo "Processing: $POST_FILE"
          fi

      - name: Parse Front Matter & notify Worker
        if: steps.detect.outputs.no_new_posts == 'false'
        run: |
          POST_FILE="${{ steps.detect.outputs.post_file }}"

          # Extract front matter fields using Python (available on ubuntu-latest)
          python3 << 'PYEOF'
          import sys, re, json, os, urllib.request, urllib.error

          post_file = os.environ.get('POST_FILE', '')
          if not post_file or not os.path.exists(post_file):
              print(f"File not found: {post_file}", file=sys.stderr)
              sys.exit(1)

          with open(post_file, 'r', encoding='utf-8') as f:
              content = f.read()

          # Parse YAML front matter
          fm_match = re.match(r'^---\s*\n(.*?)\n---', content, re.DOTALL)
          if not fm_match:
              print("No front matter found", file=sys.stderr)
              sys.exit(1)

          fm = fm_match.group(1)

          def extract(key, default=''):
              m = re.search(rf'^{key}:\s*["\']?(.+?)["\']?\s*$', fm, re.MULTILINE)
              return m.group(1).strip('"\'') if m else default

          def extract_list(key):
              m = re.search(rf'^{key}:\s*\[(.+?)\]', fm, re.MULTILINE)
              if not m: return []
              return [t.strip().strip('"\'') for t in m.group(1).split(',')]

          post_id    = extract('id')
          title      = extract('title')
          summary    = extract('summary')
          image      = extract('image')
          tags       = extract_list('tags')

          # Derive slug from filename (e.g. _posts/2026-07-31-hello-world.md → 2026-07-31-hello-world)
          slug = os.path.basename(post_file).replace('.md', '')

          if not post_id or not title:
              print("Missing required front matter: id and title", file=sys.stderr)
              sys.exit(1)

          payload = {
              'post_id': post_id,
              'title': title,
              'summary': summary,
              'tags': tags,
              'image': image if image else None,
              'slug': slug,
              'date': extract('date')
          }

          worker_url = os.environ['WORKER_API_URL'] + '/api/notify'
          notify_secret = os.environ['NOTIFY_SECRET']

          data = json.dumps(payload).encode('utf-8')
          req = urllib.request.Request(
              worker_url,
              data=data,
              headers={
                  'Content-Type': 'application/json',
                  'Authorization': f'Bearer {notify_secret}'
              },
              method='POST'
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as res:
                  body = json.loads(res.read())
                  print(f"✅ Notified Worker: {body}")
          except urllib.error.HTTPError as e:
              print(f"❌ Worker HTTP Error {e.code}: {e.read().decode()}", file=sys.stderr)
              sys.exit(1)
          PYEOF
        env:
          POST_FILE: ${{ steps.detect.outputs.post_file }}
          WORKER_API_URL: ${{ secrets.WORKER_API_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
