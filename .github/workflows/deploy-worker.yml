name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy-worker:
    name: Deploy CF Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./worker
        run: npm install

      - name: Deploy to Cloudflare Workers
        working-directory: ./worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: Sync Worker Secrets
        working-directory: ./worker
        run: |
          if [ -n "$TURNSTILE_SECRET_KEY" ]; then
            echo "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY
            echo "✅ Successfully synced TURNSTILE_SECRET_KEY to Cloudflare Worker"
          else
            echo "ℹ️ TURNSTILE_SECRET_KEY not provided in GitHub Secrets, skipping"
          fi
          if [ -n "$VAULT_KEY" ]; then
            echo "$VAULT_KEY" | npx wrangler secret put VAULT_KEY
            echo "✅ Successfully synced VAULT_KEY to Cloudflare Worker"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          VAULT_KEY: ${{ secrets.VAULT_KEY }}
